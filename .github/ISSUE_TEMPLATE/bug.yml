name: Bug report
description: Something does not work (build, install, sound, mic switching).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (release tag or commit)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Attach the output of `scripts/collect-evidence.sh`. For build or install
        problems, also paste the output of the failing command (for DKMS:
        /var/lib/dkms/macbookair6-cs4208/<version>/build/make.log).
    validations:
      required: true
