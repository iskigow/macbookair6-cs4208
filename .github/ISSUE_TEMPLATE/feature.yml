name: Feature request
description: Suggest an improvement (for example headset buttons or another kernel).
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Ideas on how (optional)
      description: Hardware behaviour, measurements or references that would help.
