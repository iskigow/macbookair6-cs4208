# SPDX-License-Identifier: GPL-2.0-only
# Cirrus Logic CS4208 driver (snd-hda-codec-cs420x) with MacBookAir6,x fixes,
# built from src/ against an internal-header set that matches the kernel
# (see packaging/). Only kernels verified to match are built; on any other
# kernel DKMS skips the build and the stock driver keeps working.
PACKAGE_NAME="macbookair6-cs4208"
PACKAGE_VERSION="0.1.1"
BUILT_MODULE_NAME[0]="snd-hda-codec-cs420x"
BUILT_MODULE_LOCATION[0]="packaging/build/${kernelver}"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C packaging KVER=${kernelver}"
CLEAN="make -C packaging clean"
BUILD_EXCLUSIVE_KERNEL="^7\.0\.0-(43|44)-generic$"
AUTOINSTALL="yes"
