#
# MacBookAir6,x (Cirrus CS4208): keep the HDA controller awake when idle.
#
# While the HDA controller is runtime-suspended, the codec's unsolicited
# plug event is lost, so after plugging a headset into an idle machine the
# next sound starts on the speakers. The codec itself still powers down
# (D3) with power_save; this parameter only stops the PCI controller from
# runtime-suspending. It applies to every snd_hda_intel controller (on
# these machines also the HDMI audio controller). See docs/findings.md.
#
# Install:  sudo install -m 644 modprobe.d/macbookair-audio.conf /etc/modprobe.d/
# Remove:   sudo rm /etc/modprobe.d/macbookair-audio.conf
# Takes effect after a reboot.
options snd_hda_intel power_save_controller=N
